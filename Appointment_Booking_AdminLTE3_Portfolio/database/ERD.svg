<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="36" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#1f2937">Appointment Booking System — ERD</text>
<defs><style>
.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2;rx:9}.head{fill:#dbeafe}.title{font:bold 18px Arial;fill:#1e3a8a}.txt{font:14px Arial;fill:#111827}.rel{stroke:#475569;stroke-width:2;fill:none}.card{font:bold 13px Arial;fill:#334155}
</style></defs>
<!-- customers -->
<rect class="box" x="50" y="100" width="300" height="220"/><rect class="head" x="50" y="100" width="300" height="38" rx="9"/>
<text class="title" x="200" y="125" text-anchor="middle">CUSTOMERS</text>
<text class="txt" x="70" y="165">PK customer_id</text><text class="txt" x="70" y="190">first_name</text><text class="txt" x="70" y="215">last_name</text><text class="txt" x="70" y="240">phone (unique)</text><text class="txt" x="70" y="265">email (optional, unique)</text><text class="txt" x="70" y="290">created_at</text>
<!-- appointments -->
<rect class="box" x="450" y="210" width="330" height="310"/><rect class="head" x="450" y="210" width="330" height="38" rx="9"/>
<text class="title" x="615" y="235" text-anchor="middle">APPOINTMENTS</text>
<text class="txt" x="470" y="275">PK appointment_id</text><text class="txt" x="470" y="300">FK customer_id</text><text class="txt" x="470" y="325">FK service_id</text><text class="txt" x="470" y="350">FK staff_id</text><text class="txt" x="470" y="375">start_at</text><text class="txt" x="470" y="400">end_at</text><text class="txt" x="470" y="425">status</text><text class="txt" x="470" y="450">notes</text><text class="txt" x="470" y="475">created_at / updated_at</text>
<!-- services -->
<rect class="box" x="850" y="80" width="300" height="230"/><rect class="head" x="850" y="80" width="300" height="38" rx="9"/>
<text class="title" x="1000" y="105" text-anchor="middle">SERVICES</text>
<text class="txt" x="870" y="145">PK service_id</text><text class="txt" x="870" y="170">service_name (unique)</text><text class="txt" x="870" y="195">description</text><text class="txt" x="870" y="220">duration_minutes</text><text class="txt" x="870" y="245">price</text><text class="txt" x="870" y="270">is_active</text>
<!-- staff -->
<rect class="box" x="850" y="420" width="300" height="230"/><rect class="head" x="850" y="420" width="300" height="38" rx="9"/>
<text class="title" x="1000" y="445" text-anchor="middle">STAFF</text>
<text class="txt" x="870" y="485">PK staff_id</text><text class="txt" x="870" y="510">first_name</text><text class="txt" x="870" y="535">last_name</text><text class="txt" x="870" y="560">phone (unique)</text><text class="txt" x="870" y="585">email (optional, unique)</text><text class="txt" x="870" y="610">is_active</text>
<!-- relationships -->
<path class="rel" d="M350 220 L400 220 L400 300 L450 300"/><text class="card" x="358" y="205">1</text><text class="card" x="430" y="290">0..*</text><text class="card" x="360" y="245">makes</text>
<path class="rel" d="M850 200 L810 200 L810 325 L780 325"/><text class="card" x="820" y="190">1</text><text class="card" x="785" y="315">0..*</text><text class="card" x="805" y="260">selected for</text>
<path class="rel" d="M850 510 L810 510 L810 350 L780 350"/><text class="card" x="820" y="500">1</text><text class="card" x="785" y="365">0..*</text><text class="card" x="810" y="465">assigned to</text>
<text x="600" y="710" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Each appointment belongs to exactly one customer, one service, and one staff member.</text>
<text x="600" y="735" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">One customer/service/staff record may be related to zero or many appointments.</text>
</svg>
